name: Advanced Compiler CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # JOB 1: End-to-End Compiler Testing (Puppeteer)
  # ==========================================
  e2e-testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Start Local Server
        run: npm start &

      - name: Run Compiler E2E Tests
        run: npm test

  # ==========================================
  # JOB 2: Lighthouse Performance Check (Three.js ke liye)
  # ==========================================
  performance-check:
    needs: e2e-testing # Test pass hone ke baad hi chalega
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start Server
        run: npx serve . -l 3000 &

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: http://localhost:3000
          budgetPath: ./lighthouse-budget.json # Performance limits
          uploadArtifacts: true

  # ==========================================
  # JOB 3: Docker Build & Push to GitHub Registry (GHCR)
  # ==========================================
  docker-deploy:
    needs: performance-check # Performance pass hone ke baad
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GHCR me push karne ka permission
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}